services:
  - type: web
    name: sakkhiai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run db:push && npm run db:seed && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: UPLOAD_DIR
        value: "./public/uploads"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSCODE
        value: sakkhi2026
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
